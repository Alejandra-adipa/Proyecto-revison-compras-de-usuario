<script>
const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/xsgge3wkvrdptwbjgfxlflfqm89uju3l";

let searchTimer = null;
let ultimoResultado = null;

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function getInitials(nombre) {
  const parts = String(nombre || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '??';
  return parts.slice(0, 2).map(p => p[0]).join('').toUpperCase();
}

function formatMoney(value, currency = 'CLP') {
  const n = Number(value || 0);
  return '$' + n.toLocaleString('es-CL') + (currency ? ' ' + currency : '');
}

function normalizarAlumnoDesdeMake(data) {
  const nombre = [data.nombre_hubspot, data.apellido_hubspot].filter(Boolean).join(' ').trim() || data.busqueda || 'Contacto sin nombre';
  const email = data.email_hubspot || data.busqueda || '';
  const telefono = data.telefono_hubspot || '—';
  const hubspotUrl = data.hubspot_url || '#';

  return {
    id: data.hubspot_id || email,
    nombre,
    initials: getInitials(nombre),
    avatarColor: "#FFEDD5",
    avatarTextColor: "#9A3412",
    desde: data.hubspot_id ? `Contacto HubSpot ID ${data.hubspot_id}` : "Contacto encontrado en HubSpot",
    telefono,
    pais: "—",
    emails: email ? [
      { addr: email, primary: true, sources: ["hs"] }
    ] : [],
    wooId: "",
    hsId: data.hubspot_id || "",
    hubspot_url: hubspotUrl,
    ordenes: Array.isArray(data.ordenes) ? data.ordenes : [],
    hs: {
      canal: data.canal_origen || "—",
      ultimoContacto: data.ultimo_contacto || "—",
      propietario: data.propietario || "—",
      notas: "Datos consultados en vivo desde HubSpot mediante Make."
    }
  };
}

function onSearch() {
  const q = document.getElementById('search-input').value.trim();
  const dd = document.getElementById('search-dropdown');

  clearTimeout(searchTimer);

  if (!q) {
    dd.classList.remove('open');
    dd.innerHTML = '';
    return;
  }

  if (q.length < 3) {
    dd.innerHTML = '<div style="padding:14px 16px; font-size:13px; color:var(--text-muted);">Escribe al menos 3 caracteres para buscar.</div>';
    dd.classList.add('open');
    return;
  }

  dd.innerHTML = '<div style="padding:14px 16px; font-size:13px; color:var(--text-muted);">Buscando en HubSpot...</div>';
  dd.classList.add('open');

  searchTimer = setTimeout(() => buscarAlumnoEnMake(q), 650);
}

async function buscarAlumnoEnMake(q) {
  const dd = document.getElementById('search-dropdown');

  try {
    const url = `${MAKE_WEBHOOK_URL}?busqueda=${encodeURIComponent(q)}`;
    const response = await fetch(url, {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });

    if (!response.ok) {
      throw new Error(`Make respondió con estado ${response.status}`);
    }

    const data = await response.json();

    if (!data || data.resultado !== 'ok' || !data.email_hubspot) {
      dd.innerHTML = `<div style="padding:14px 16px; font-size:13px; color:var(--text-muted);">Sin resultados para "${escapeHtml(q)}".</div>`;
      dd.classList.add('open');
      return;
    }

    ultimoResultado = normalizarAlumnoDesdeMake(data);

    dd.innerHTML = `
      <div class="search-result-item" onclick="selectAlumnoEnVivo()">
        <div class="result-avatar" style="background:${ultimoResultado.avatarColor}; color:${ultimoResultado.avatarTextColor};">${escapeHtml(ultimoResultado.initials)}</div>
        <div>
          <div class="result-name">${escapeHtml(ultimoResultado.nombre)}</div>
          <div class="result-email">${escapeHtml(ultimoResultado.emails[0]?.addr || q)}</div>
        </div>
        <div style="margin-left:auto; display:flex; gap:4px;">
          <span class="source-pill pill-hs" style="font-size:10px;">HubSpot</span>
        </div>
      </div>
    `;
    dd.classList.add('open');

  } catch (error) {
    dd.innerHTML = `
      <div style="padding:14px 16px; font-size:13px; color:var(--red);">
        No se pudo consultar Make. Revisa que el escenario esté activo y que el Webhook Response tenga CORS.
        <br><span style="font-size:11px; color:var(--text-muted);">${escapeHtml(error.message)}</span>
      </div>`;
    dd.classList.add('open');
  }
}

function selectAlumnoEnVivo() {
  if (!ultimoResultado) return;
  document.getElementById('search-input').value = ultimoResultado.emails[0]?.addr || ultimoResultado.nombre;
  document.getElementById('search-dropdown').classList.remove('open');
  renderLeft(ultimoResultado);
  renderRight(ultimoResultado);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('search-dropdown').classList.remove('open');
  }
});

function renderLeft(a) {
  document.getElementById('left-empty').style.display = 'none';
  const lc = document.getElementById('left-content');
  lc.style.display = 'flex';

  document.getElementById('lft-avatar').textContent = a.initials;
  document.getElementById('lft-avatar').style.background = a.avatarColor;
  document.getElementById('lft-avatar').style.color = a.avatarTextColor;
  document.getElementById('lft-name').textContent = a.nombre;
  document.getElementById('lft-since').textContent = a.desde;
  document.getElementById('lft-tel').textContent = a.telefono || '—';
  document.getElementById('lft-pais').textContent = a.pais || '—';

  const wooLink = document.getElementById('lft-link-woo');
  wooLink.href = '#';
  wooLink.style.opacity = '0.45';
  wooLink.onclick = (e) => {
    e.preventDefault();
    alert('Las órdenes de WooCommerce todavía no están conectadas a la búsqueda en vivo.');
  };

  const hsLink = document.getElementById('lft-link-hs');
  hsLink.href = a.hubspot_url || '#';

  const emailsEl = document.getElementById('lft-emails');
  emailsEl.innerHTML = '';

  if (!a.emails.length) {
    emailsEl.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Sin correo disponible.</div>';
  }

  a.emails.forEach(e => {
    const srcTags = e.sources.map(s =>
      `<span class="email-source ${s}">${s === 'woo' ? 'WooCommerce' : 'HubSpot'}</span>`
    ).join('');
    const primaryBadge = e.primary ? '<span class="email-primary-badge">principal</span>' : '';
    emailsEl.innerHTML += `
      <div class="email-entry">
        <span style="font-size:14px;">📧</span>
        <span class="email-addr">${escapeHtml(e.addr)}</span>
        ${primaryBadge}
        ${srcTags}
      </div>`;
  });

  document.getElementById('lft-conflict').style.display = 'none';
}

function renderRight(a) {
  document.getElementById('right-empty').style.display = 'none';
  document.getElementById('right-content').style.display = 'block';

  const ordenes = Array.isArray(a.ordenes) ? a.ordenes : [];
  const totalPagado = ordenes.filter(o => ['pagado', 'completed', 'processing'].includes(o.estado)).reduce((s, o) => s + Number(o.total || 0), 0);
  const totalProgramas = [...new Set(ordenes.flatMap(o => o.programas || []))].length;
  const ultimaOrden = ordenes[0];

  document.getElementById('met-total').textContent = formatMoney(totalPagado, ordenes[0]?.moneda || 'CLP');
  document.getElementById('met-total-sub').textContent = ordenes.length ? `${ordenes.length} orden${ordenes.length !== 1 ? 'es' : ''}` : 'Sin órdenes conectadas';
  document.getElementById('met-programas').textContent = totalProgramas;
  document.getElementById('met-ultima').textContent = ultimaOrden ? ultimaOrden.fecha : '—';
  document.getElementById('met-ultima-sub').textContent = ultimaOrden ? ultimaOrden.id : 'Pendiente conectar WooCommerce';
  document.getElementById('met-hs-stage').innerHTML = `<a href="${a.hubspot_url || '#'}" target="_blank" style="display:inline-flex; align-items:center; gap:5px; color:var(--orange); font-size:13px; font-weight:500; text-decoration:none;">📧 Ver HubSpot ↗</a>`;

  document.getElementById('woo-link-all').onclick = () => alert('La búsqueda de órdenes WooCommerce todavía no está conectada a esta ruta.');
  document.getElementById('hs-link-contact').onclick = () => window.open(a.hubspot_url || '#', '_blank');

  const tbody = document.getElementById('orders-tbody');
  tbody.innerHTML = '';

  if (!ordenes.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="padding:18px; color:var(--text-muted); text-align:center;">
          Aún no se están devolviendo órdenes de WooCommerce en la consulta en vivo. 
          El contacto de HubSpot ya está conectado.
        </td>
      </tr>`;
  }

  ordenes.forEach((o, i) => {
    const estado = o.estado || 'pendiente';
    const badgeClass = { pagado: 'badge-paid', completed: 'badge-paid', processing: 'badge-paid', pendiente: 'badge-pending', pending: 'badge-pending', cancelado: 'badge-cancelled', cancelled: 'badge-cancelled' }[estado] || 'badge-pending';
    const badgeLabel = { pagado: '✓ Pagado', completed: '✓ Pagado', processing: '✓ Procesando', pendiente: '⏳ Pendiente', pending: '⏳ Pendiente', cancelado: '✕ Cancelado', cancelled: '✕ Cancelado' }[estado] || estado;
    const programaTags = (o.programas || []).map(p => `<span class="programa-tag">📖 ${escapeHtml(p)}</span>`).join('');
    const rowId = 'desglose-live-' + i;

    tbody.innerHTML += `
      <tr onclick="toggleDesglose('${rowId}')" style="cursor:pointer;">
        <td><span class="order-id">#${escapeHtml(o.id)}</span></td>
        <td style="color:var(--text-muted); font-size:12px;">${escapeHtml(o.fecha || '—')}</td>
        <td><div class="programa-list">${programaTags || '—'}</div></td>
        <td style="font-weight:600; font-family:'DM Mono',monospace; font-size:13px;">${formatMoney(o.total, o.moneda || 'CLP')}</td>
        <td><span class="badge ${badgeClass}">${escapeHtml(badgeLabel)}</span></td>
        <td><button class="expand-btn" id="btn-${rowId}">▾</button></td>
      </tr>
      <tr class="desglose-row" id="${rowId}">
        <td colspan="6">
          <div class="desglose-inner">
            ${(o.items || []).map(it => `
              <div class="desglose-line">
                <span>${escapeHtml(it.nombre)}</span>
                <span>${formatMoney(it.precio, o.moneda || 'CLP')}</span>
              </div>`).join('')}
            <div class="desglose-line total-line">
              <span>Total</span>
              <span>${formatMoney(o.total, o.moneda || 'CLP')}</span>
            </div>
            <div style="margin-top:8px; font-size:11px; color:var(--text-muted);">
              💳 ${escapeHtml(o.metodo || '—')} &nbsp;·&nbsp; Orden #${escapeHtml(o.id)}
            </div>
          </div>
        </td>
      </tr>`;
  });

  const hsUrl = a.hubspot_url || '#';
  document.getElementById('hs-grid').innerHTML = `
    <div class="hs-card" style="grid-column: 1 / -1; background: var(--orange-light); border-color: #FED7AA; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
      <div>
        <div class="hs-field-label" style="color:var(--orange);">Ver en HubSpot</div>
        <div style="font-size:13px; color:var(--orange); margin-top:2px;">Revisa correos enviados, historial de actividad y etapa del contacto directamente en HubSpot.</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a href="${hsUrl}" target="_blank" style="display:inline-flex; align-items:center; gap:6px; background:var(--orange); color:#fff; font-size:13px; font-weight:500; padding:8px 14px; border-radius:var(--radius-sm); text-decoration:none; white-space:nowrap;">
          📧 Correos e historial ↗
        </a>
        <a href="${hsUrl}" target="_blank" style="display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--orange); border:1px solid #FCA97A; font-size:13px; font-weight:500; padding:8px 14px; border-radius:var(--radius-sm); text-decoration:none; white-space:nowrap;">
          🟠 Ficha completa ↗
        </a>
      </div>
    </div>
    <div class="hs-card">
      <div class="hs-field-label">Canal de origen</div>
      <div class="hs-field-val">${escapeHtml(a.hs.canal)}</div>
    </div>
    <div class="hs-card">
      <div class="hs-field-label">Último contacto</div>
      <div class="hs-field-val">${escapeHtml(a.hs.ultimoContacto)}</div>
    </div>
    <div class="hs-card" style="grid-column: 1 / -1;">
      <div class="hs-field-label">Nota interna</div>
      <div class="hs-field-val" style="font-weight:400; color:var(--text-muted); font-size:13px;">${escapeHtml(a.hs.notas)}</div>
    </div>
  `;
}

function toggleDesglose(rowId) {
  const row = document.getElementById(rowId);
  const btn = document.getElementById('btn-' + rowId);
  const isOpen = row.classList.contains('open');
  row.classList.toggle('open', !isOpen);
  if (btn) btn.textContent = isOpen ? '▾' : '▴';
}
</script>
